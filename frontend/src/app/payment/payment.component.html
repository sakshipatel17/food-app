<div class="container mt-5">
  <div class="payment-container">
    <h3>Payment Page</h3>

    <p>
      You are about to pay <strong>₹{{ grandTotal }}</strong>
    </p>

    <h5>Select Payment Method</h5>
    <div class="payment-methods">
      <button
        class="payment-method"
        [class.selected]="selectedMethod === 'Cash'"
        (click)="proceed('Cash')"
      >
        <div class="payment-method-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="5" width="20" height="14" rx="2"/>
            <line x1="2" y1="10" x2="22" y2="10"/>
          </svg>
        </div>
        Cash
      </button>
      <button
        class="payment-method"
        [class.selected]="selectedMethod === 'Credit Card'"
        (click)="proceed('Credit Card')"
      >
        <div class="payment-method-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="1" y="4" width="22" height="16" rx="2" ry="2"/>
            <line x1="1" y1="10" x2="23" y2="10"/>
          </svg>
        </div>
        Credit Card
      </button>
      <button
        class="payment-method"
        [class.selected]="selectedMethod === 'PayPal/UPI'"
        (click)="proceed('PayPal/UPI')"
      >
        <div class="payment-method-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
            <line x1="8" y1="21" x2="16" y2="21"/>
            <line x1="12" y1="17" x2="12" y2="21"/>
          </svg>
        </div>
        PayPal / UPI
      </button>
    </div>

    <div *ngIf="paymentDone" class="alert-success">
      Payment successful via <strong>{{ selectedMethod }}</strong>! Redirecting to home...
    </div>

    <div class="text-center">
      <a routerLink="/check-out" class="back-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"/>
          <polyline points="12 19 5 12 12 5"/>
        </svg>
        Back to Checkout
      </a>
    </div>
  </div>
</div>
